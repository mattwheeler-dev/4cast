<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="images/favicon.ico" />
		<link rel="stylesheet" href="styles.css" />
		<script src="scripts.js" defer></script>
		<script
			src="https://kit.fontawesome.com/1e723eb9a7.js"
			crossorigin="anonymous"
			defer
		></script>
		<title>4Cast - Weather App</title>
	</head>
	<body>
		<header>
			<h1>
				<i class="fa-solid fa-temperature-three-quarters"></i>
				4Cast Weather App
			</h1>
			<p>Get it? 4 days of weather & sounds like 'forecast'...</p>

			<input
				type="text"
				name="search"
				id="search-input"
				placeholder="Search Location..."
				autocomplete="off"
			/>
			<button type="submit" id="search-btn">
				<i class="fa-solid fa-magnifying-glass"></i>
			</button>
			<p id="error-msg" aria-live="polite"></p>

			<div id="unit-btns">
				Units:
				<button class="unit-btn" id="f-btn">&deg;F / mph</button>
				<button class="unit-btn" id="c-btn">&deg;C / kph</button>
			</div>
		</header>

		<section id="current">
			<h2>Location: <span id="location"></span></h2>
			<h3 class="date"></h3>
			<h4 class="weather"></h4>
			<img src="#" alt="" class="icon" height="100" width="100" />
			<p class="temp"></p>
			<p class="feels-temp"></p>
			<p class="humidity"></p>
			<p class="wind"></p>
		</section>

		<section id="forecast">
			<h2>3 - Day Forecast</h2>
			<article class="day">
				<h3 class="date"></h3>
				<h4 class="weather"></h4>
				<img src="#" alt="" class="icon" />
				<p class="temp"></p>
				<p class="low"></p>
				<p class="high"></p>
			</article>

			<article class="day">
				<h3 class="date"></h3>
				<h4 class="weather"></h4>
				<img src="#" alt="" class="icon" />
				<p class="temp"></p>
				<p class="low"></p>
				<p class="high"></p>
			</article>

			<article class="day">
				<h3 class="date"></h3>
				<h4 class="weather"></h4>
				<img src="#" alt="" class="icon" />
				<p class="temp"></p>
				<p class="low"></p>
				<p class="high"></p>
			</article>
		</section>

		<footer>
			<p>
				Find Me:
				<a
					href="https://www.linkedin.com/in/mattwheeler-dev/"
					target="_blank"
				>
					<i class="fa-brands fa-linkedin"></i>
				</a>
				<a href="https://github.com/mattwheeler-dev" target="_blank">
					<i class="fa-brands fa-github"></i>
				</a>
			</p>
			<p>
				Built using
				<a
					href="https://www.weatherapi.com/"
					title="Free Weather API"
					target="_blank"
					>WeatherAPI</a
				>
			</p>
		</footer>
	</body>
</html>
